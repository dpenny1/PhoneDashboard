<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; color: #1a1a2e; min-height: 100vh; }

  nav {
    background: #1a1a2e; height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: sticky; top: 0; z-index: 100;
  }
  .nav-left { display: flex; align-items: center; gap: 12px; }
  .nav-logo  { width: 28px; height: 28px; border-radius: 6px; background: #1a56db; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 13px; }
  .nav-title { color: #fff; font-size: 14px; font-weight: 600; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-time  { color: #94a3b8; font-size: 12px; font-variant-numeric: tabular-nums; }
  .back-link { font-size: 12px; color: #94a3b8; text-decoration: none; padding: 4px 10px; border: 1px solid #334155; border-radius: 5px; transition: all 0.15s; }
  .back-link:hover { color: #fff; border-color: #64748b; }
  .live-pill { background: #14532d; color: #4ade80; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: flex; align-items: center; gap: 5px; }
  .live-dot  { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes spin  { to { transform: rotate(360deg); } }

  .page { max-width: 900px; margin: 28px auto; padding: 0 20px 40px; display: flex; flex-direction: column; gap: 16px; }

  /* ── Agent header card ── */
  .agent-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 24px 28px; display: flex; align-items: center; gap: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; background: #1a56db;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .agent-info { flex: 1; }
  .agent-name-big { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .agent-dept     { font-size: 13px; color: #64748b; margin-top: 2px; }
  .mismatch-badge { background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid #fcd34d; margin-top: 6px; display: inline-block; }

  /* ── Status cards ── */
  .status-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .status-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .status-card-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .status-pill-lg {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 999px; font-size: 16px; font-weight: 700;
  }
  .pill-dot-lg { width: 10px; height: 10px; border-radius: 50%; }
  .duration-line { margin-top: 10px; font-size: 13px; color: #64748b; }
  .duration-val  { font-weight: 600; color: #1a1a2e; }

  /* pill colors */
  .mvp-available  { background:#dcfce7; color:#15803d; } .mvp-available  .pill-dot-lg { background:#15803d; }
  .mvp-busy       { background:#fee2e2; color:#dc2626; } .mvp-busy       .pill-dot-lg { background:#dc2626; }
  .mvp-dnd        { background:#fef3c7; color:#b45309; } .mvp-dnd        .pill-dot-lg { background:#b45309; }
  .mvp-offline    { background:#f1f5f9; color:#64748b; } .mvp-offline    .pill-dot-lg { background:#94a3b8; }
  .cx-available   { background:#dcfce7; color:#15803d; } .cx-available   .pill-dot-lg { background:#15803d; }
  .cx-oncall      { background:#fee2e2; color:#dc2626; } .cx-oncall      .pill-dot-lg { background:#dc2626; }
  .cx-acw         { background:#ede9fe; color:#6d28d9; } .cx-acw         .pill-dot-lg { background:#7c3aed; }
  .cx-break       { background:#fef3c7; color:#b45309; } .cx-break       .pill-dot-lg { background:#d97706; }
  .cx-lunch       { background:#ffedd5; color:#c2410c; } .cx-lunch       .pill-dot-lg { background:#ea580c; }
  .cx-training    { background:#dbeafe; color:#1d4ed8; } .cx-training    .pill-dot-lg { background:#2563eb; }
  .cx-loggedout   { background:#f1f5f9; color:#64748b; } .cx-loggedout   .pill-dot-lg { background:#94a3b8; }
  .cx-refused     { background:#fee2e2; color:#dc2626; } .cx-refused     .pill-dot-lg { background:#dc2626; }

  /* ── Info rows ── */
  .info-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .info-card-title { font-size: 13px; font-weight: 700; color: #1a1a2e; margin-bottom: 14px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #64748b; }
  .info-val   { font-weight: 600; color: #1a1a2e; }

  .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px; }
  .act-btn { padding: 8px 16px; border-radius: 7px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .act-btn:hover { opacity: 0.85; }
  .act-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .act-green { background: #dcfce7; color: #15803d; }
  .act-amber { background: #fef3c7; color: #92400e; }
  .act-blue  { background: #dbeafe; color: #1d4ed8; }
  .act-red   { background: #fee2e2; color: #dc2626; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <div class="nav-logo">RC</div>
    <span class="nav-title">Agent Dashboard</span>
    <span style="font-size:10px;color:#475569;background:#1e293b;padding:2px 7px;border-radius:999px;font-weight:600;letter-spacing:0.04em">v1.3.0</span>
  </div>
  <div class="nav-right">
    <a href="rc-dashboard.html" class="back-link">← Supervisor Dashboard</a>
    <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    <span class="nav-time" id="clock"></span>
  </div>
</nav>

<div class="page" id="page">
  <div class="empty-state" id="emptyState">Loading agent...</div>
</div>

<script>
function tick(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
setInterval(tick,1000); tick();

function fmtDur(m){ return m < 60 ? m+'m' : Math.floor(m/60)+'h '+(m%60)+'m'; }

function mvpCls(label){
  return { 'Available':'mvp-available', 'On a Call':'mvp-busy', 'Do Not Disturb':'mvp-dnd', 'Offline':'mvp-offline' }[label] || 'mvp-offline';
}
function cxCls(label){
  return { 'Available':'cx-available','On Call':'cx-oncall','ACW':'cx-acw','Break':'cx-break','Lunch':'cx-lunch','Training':'cx-training','Logged Out':'cx-loggedout','Refused':'cx-refused' }[label] || 'cx-loggedout';
}
function isMismatch(mvp, cx){
  if(cx==='Logged Out') return false;
  if(mvp==='On a Call' && cx!=='On Call' && cx!=='ACW') return true;
  if(mvp==='Available' && (cx==='Break'||cx==='Lunch')) return true;
  if(mvp==='Offline'   && (cx==='Available'||cx==='On Call')) return true;
  return false;
}

function initials(name){
  return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
}

// The page is built from a snapshot handed over in the URL, so after an action
// we update this copy and re-render — otherwise the pills keep showing the old
// values even though the change went through.
let currentAgent = null;

// Same mapping the supervisor dashboard uses, so both pages agree
function mvpLabelFrom(p) {
  if (p.telephonyStatus === 'CallConnected') return 'On a Call';
  const dnd = p.dndStatus || '';
  if (dnd === 'DoNotAcceptAnyCalls' || dnd === 'DoNotAcceptDepartmentCalls') return 'Do Not Disturb';
  if ((p.presenceStatus || p.userStatus) === 'Busy') return 'On a Call';
  if (p.presenceStatus === 'Available' || p.userStatus === 'Available') return 'Available';
  return 'Offline';
}

// Read the extension back from RingCentral rather than assuming what the new
// label is — 'TakeAllCalls' only means Available if they are not on a call.
async function refreshMvpFromRC() {
  if (!currentAgent || !currentAgent.id) return;
  try {
    const { rcFetch } = await import('./rc-auth.js');
    const p = await rcFetch('/account/~/extension/' + currentAgent.id + '/presence?detailedTelephonyState=true');
    currentAgent.mvp = mvpLabelFrom(p);
    render(currentAgent);
  } catch (e) {
    // The update itself succeeded; leave the pill rather than showing a guess
    console.warn('Could not re-read presence:', e.message);
  }
}

function render(agent){
  currentAgent = agent;
  const mismatch = isMismatch(agent.mvp, agent.cx);
  // CXone actions only mean anything against a live CXone session. Without one
  // (no linked account, or logged out) the API rejects them, so don't offer them.
  const cxOnline = !!agent.cxId && agent.cx !== 'Logged Out';
  const page = document.getElementById('page');
  page.innerHTML = `
    <!-- Agent header -->
    <div class="agent-card">
      <div class="avatar">${initials(agent.name)}</div>
      <div class="agent-info">
        <div class="agent-name-big">${agent.name}</div>
        <div class="agent-dept">${agent.group}</div>
        ${mismatch ? '<span class="mismatch-badge">⚠ Status Mismatch</span>' : ''}
      </div>
    </div>

    <!-- Status cards -->
    <div class="status-row">
      <div class="status-card">
        <div class="status-card-label">RingCentral MVP Status</div>
        <span class="status-pill-lg ${mvpCls(agent.mvp)}">
          <span class="pill-dot-lg"></span>${agent.mvp}
        </span>
        <!-- No duration here: agent.dur is the CXone state duration. RingCentral
             presence gives us no equivalent, so showing it would be wrong. -->
      </div>
      <div class="status-card">
        <div class="status-card-label">CXone Contact Center Status</div>
        <span class="status-pill-lg ${cxCls(agent.cx)}">
          <span class="pill-dot-lg"></span>${agent.cx}
        </span>
        <div class="duration-line">CXone State Time <span class="duration-val">${fmtDur(agent.dur)}</span></div>
      </div>
    </div>

    <!-- Details -->
    <div class="info-card">
      <div class="info-card-title">Agent Details</div>
      <div class="info-row"><span class="info-label">Department</span><span class="info-val">${agent.group}</span></div>
      <div class="info-row"><span class="info-label">RC Extension ID</span><span class="info-val">${agent.id || '—'}</span></div>
      <div class="info-row"><span class="info-label">Status Mismatch</span><span class="info-val" style="color:${mismatch?'#dc2626':'#15803d'}">${mismatch ? 'Yes — needs attention' : 'No'}</span></div>
      <div class="info-row"><span class="info-label">Time in current state</span><span class="info-val">${fmtDur(agent.dur)}</span></div>
    </div>

    <!-- Actions -->
    <div class="info-card">
      <div class="info-card-title">Actions</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:4px">

        <div>
          <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px">Set MVP Status</div>
          <div style="display:flex;gap:8px">
            <button class="act-btn act-green" onclick="setMvpStatus('${agent.id}','TakeAllCalls',this)">✅ Available</button>
            <button class="act-btn act-amber" onclick="setMvpStatus('${agent.id}','DoNotAcceptAnyCalls',this)">🔕 Do Not Disturb</button>
          </div>
        </div>

        ${cxOnline ? `
        <div>
          <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px">Set CXone State</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="act-btn act-green"  onclick="setCxState('${agent.cxId}','Available',this)">✅ Available</button>
            <button class="act-btn act-amber"  onclick="setCxState('${agent.cxId}','Break',this)">☕ Break</button>
            <button class="act-btn act-amber"  onclick="setCxState('${agent.cxId}','Lunch',this)">🍽 Lunch</button>
            <button class="act-btn act-blue"   onclick="setCxState('${agent.cxId}','Training',this)">📚 Training</button>
          </div>
        </div>

        <div>
          <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px">CXone Session</div>
          <button class="act-btn act-red" onclick="doCxLogout('${agent.cxId}','${agent.name}',this)">⏏ Logout from CXone</button>
        </div>
        ` : `
        <div style="font-size:12px;color:#64748b;background:#f8faff;border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px;line-height:1.6">
          <strong style="color:#475569">CXone actions unavailable</strong><br>
          ${!agent.cxId
            ? 'No CXone account is linked to this agent, so their CXone state cannot be changed from here.'
            : agent.name.split(' ')[0] + ' is logged out of CXone. State changes and logout need a live session — they can still take direct calls on RingCentral.'}
        </div>
        `}

        <div id="actionMsg" style="font-size:12px;display:none"></div>
      </div>
    </div>
  `;
}

function showMsg(msg, color) {
  const el = document.getElementById('actionMsg');
  if (!el) return;
  el.textContent = msg; el.style.color = color; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

async function setMvpStatus(rcId, dndStatus, btn) {
  if (!rcId) { showMsg('RC ID not available.', '#dc2626'); return; }
  btn.disabled = true;
  try {
    const { setAgentPresence } = await import('./rc-auth.js');
    await setAgentPresence(rcId, dndStatus);
    await refreshMvpFromRC();          // re-render first — this rebuilds #actionMsg
    showMsg('MVP status updated.', '#15803d');
    return;                            // btn belongs to the old DOM now
  } catch(e) { showMsg('Failed: ' + e.message, '#dc2626'); }
  btn.disabled = false;
}

async function setCxState(cxId, state, btn) {
  if (!cxId) { showMsg('CXone ID not available — CXone data must be connected.', '#dc2626'); return; }
  btn.disabled = true;
  try {
    const { setAgentState } = await import('./cx-auth.js');
    await setAgentState(cxId, state);
    if (currentAgent) { currentAgent.cx = state; render(currentAgent); }
    showMsg('CXone state updated to ' + state + '.', '#15803d');
    return;
  } catch(e) { showMsg('Failed: ' + e.message, '#dc2626'); }
  btn.disabled = false;
}

async function doCxLogout(cxId, name, btn) {
  if (!cxId) { showMsg('CXone ID not available — CXone data must be connected.', '#dc2626'); return; }
  if (!confirm('Log ' + name + ' out of CXone?')) return;
  btn.disabled = true;
  try {
    const { logoutAgent } = await import('./cx-auth.js');
    await logoutAgent(cxId);
    if (currentAgent) { currentAgent.cx = 'Logged Out'; render(currentAgent); }
    showMsg(name + ' logged out of CXone.', '#15803d');
    return;
  } catch(e) { showMsg('Failed: ' + e.message, '#dc2626'); }
  btn.disabled = false;
}

// Read agent from URL params
const params = new URLSearchParams(location.search);
const raw = params.get('agent');
if (raw) {
  try {
    const agent = JSON.parse(decodeURIComponent(raw));
    document.title = agent.name + ' — Agent Dashboard';
    render(agent);
  } catch(e) {
    document.getElementById('emptyState').textContent = 'Could not load agent data.';
  }
} else {
  document.getElementById('emptyState').innerHTML = 'No agent selected.<br><a href="rc-dashboard.html" style="color:#1a56db">← Back to Supervisor Dashboard</a>';
}
</script>
</body>
</html>
